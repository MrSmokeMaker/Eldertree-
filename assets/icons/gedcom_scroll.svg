<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Parchment Scroll Body -->
  <!-- Upper Curl of Scroll -->
  <path d="M30 26 C30 20 40 18 60 18 C80 18 90 20 90 26 C90 32 80 34 60 34 C40 34 30 32 30 26 Z" 
        fill="#F9F8F6" stroke="#2D4A3E" stroke-width="1.8"/>
  <ellipse cx="30" cy="26" rx="4" ry="7" fill="#D4AF37" stroke="#2D4A3E" stroke-width="1.2"/>
  
  <!-- Main Sheet Unfurled -->
  <path d="M30 26 L30 88 C30 96 38 98 48 98 L86 98 C92 98 94 92 94 86 L94 26" 
        fill="#F9F8F6" stroke="#2D4A3E" stroke-width="1.8"/>
  
  <!-- Lower Roll -->
  <path d="M26 94 C26 90 34 88 52 88 C70 88 96 88 96 94 C96 100 70 102 52 102 C34 102 26 98 26 94 Z" 
        fill="#D4AF37" stroke="#2D4A3E" stroke-width="1.4"/>
  <ellipse cx="26" cy="94" rx="3.5" ry="5.5" fill="#2D4A3E"/>

  <!-- Inscribed Pedigree Chart Lines (Genealogy Tree on Parchment) -->
  <!-- Generation 1 Node -->
  <circle cx="62" cy="44" r="3.5" fill="#2D4A3E"/>
  <line x1="62" y1="47.5" x2="62" y2="55" stroke="#D4AF37" stroke-width="1.2"/>
  <line x1="48" y1="55" x2="76" y2="55" stroke="#D4AF37" stroke-width="1.2"/>
  
  <!-- Generation 2 Nodes -->
  <line x1="48" y1="55" x2="48" y2="62" stroke="#D4AF37" stroke-width="1.2"/>
  <line x1="76" y1="55" x2="76" y2="62" stroke="#D4AF37" stroke-width="1.2"/>
  <circle cx="48" cy="64" r="2.8" fill="#2D4A3E"/>
  <circle cx="76" cy="64" r="2.8" fill="#2D4A3E"/>

  <!-- Generation 3 Branches & Nodes -->
  <line x1="48" y1="67" x2="48" y2="72" stroke="#2D4A3E" stroke-width="1"/>
  <line x1="42" y1="72" x2="54" y2="72" stroke="#2D4A3E" stroke-width="1"/>
  <circle cx="42" cy="76" r="2" fill="#D4AF37"/>
  <circle cx="54" cy="76" r="2" fill="#D4AF37"/>

  <line x1="76" y1="67" x2="76" y2="72" stroke="#2D4A3E" stroke-width="1"/>
  <line x1="70" y1="72" x2="82" y2="72" stroke="#2D4A3E" stroke-width="1"/>
  <circle cx="70" cy="76" r="2" fill="#D4AF37"/>
  <circle cx="82" cy="76" r="2" fill="#D4AF37"/>

  <!-- Wax Seal with Ribbon at Right Bottom -->
  <path d="M88 84 L82 108 L88 104 L94 108 L90 84 Z" fill="#D4AF37" opacity="0.8"/>
  <circle cx="88" cy="84" r="8.5" fill="#2D4A3E" stroke="#D4AF37" stroke-width="1.5"/>
  <circle cx="88" cy="84" r="5" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="1 2"/>
  <path d="M86 82 L88 80 L90 82 L90 86 L86 86 Z" fill="#D4AF37"/>
</svg>
