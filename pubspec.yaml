name: family_tree_app
description: "Premium Interactive Family Tree App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  supabase_flutter: ^2.6.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0

  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  cached_network_image: ^3.3.1
  audioplayers: ^6.1.0
  record: ^5.1.2
  flutter_svg: ^2.0.10
  flutter_dotenv: ^5.0.2
  google_fonts: ^6.2.1

  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  share_plus: ^10.0.0
  intl: any
  path_provider: ^2.1.3
  uuid: ^4.4.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/textures/branch/
    - assets/particles/
    - assets/foliage/
    - assets/sounds/
    - assets/background/


