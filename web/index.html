<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    Served from /Eldertree-/ because the repository is MrSmokeMaker/Eldertree-.
    The base href below is replaced by the value passed to `flutter build --base-href`
    and MUST match the repository name (trailing dash included), otherwise every
    asset request 404s and the page stays empty.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Eldertree — постройте семейное древо и сохраните воспоминания.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Eldertree">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Eldertree — Family Tree App</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The engine bundle (main.dart.js + canvaskit) is a few megabytes, so on a cold
    cache the first frame can take tens of seconds. This placeholder is shown
    until the app paints, instead of a blank white page.
  -->
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #f9f8f6;
      color: #212121;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    #boot-splash .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(45, 74, 62, 0.2);
      border-top-color: #2d4a3e;
      border-radius: 50%;
      animation: boot-spin 0.9s linear infinite;
    }
    #boot-splash .title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    #boot-splash .hint {
      font-size: 13px;
      color: #5b6660;
      max-width: 420px;
      line-height: 1.5;
    }
    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-color-scheme: dark) {
      #boot-splash { background: #0f1115; color: #eceff1; }
      #boot-splash .hint { color: #9aa5a0; }
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <div class="spinner"></div>
    <div class="title">Eldertree</div>
    <div class="hint" id="boot-hint">Загрузка приложения…</div>
  </div>

  <script>
    (function () {
      var splash = document.getElementById('boot-splash');
      var hint = document.getElementById('boot-hint');
      var initialTitle = document.title;
      var startedAt = Date.now();
      var viewSeenAt = 0;

      var timer = setInterval(function () {
        var view = document.querySelector('flutter-view');
        if (view && !viewSeenAt) {
          viewSeenAt = Date.now();
        }
        var elapsed = Date.now() - startedAt;

        if (hint && elapsed > 8000 && !view) {
          hint.textContent = 'Первый запуск загружает движок (~3 МБ). ' +
            'Это может занять до 30 секунд — пожалуйста, подождите.';
        }

        var painted = view && document.title !== initialTitle;
        var viewLingering = viewSeenAt && Date.now() - viewSeenAt > 3000;
        if (painted || viewLingering || elapsed > 90000) {
          clearInterval(timer);
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }
      }, 150);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
